name: Deployment - Reusable Workflow

on:
  workflow_call:
    inputs:
      mongodb-uri:
        required: true
        type: string
      kubectl-version:
        description: Provide the required Kubectl version
        default: v1.26.0
        required: false
        type: string
      k8s-manifest-dir:
        description: Directory containing Kubernetes manifests files
        default: kubernetes/
        required: true
        type: string
      environment:
        description: Provide the Deployment Environment
        default: dev
        required: true
        type: string
    secrets:
      k8s-kubeconfig:
        required: true
      mongodb-password:
        required: true

jobs:
  reuse-deploy:
    environment:
      name: ${{ inputs.environment }}
      url: https://${{ steps.set-ingress-host-address.outputs.APP_INGRESS_HOST }}
    outputs:
      APP_INGRESS_URL: ${{ steps.set-ingress-host-address.outputs.APP_INGRESS_HOST }}
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repo
      uses: actions/checkout@v4

    - name: Install kubectl CLI
      uses: azure/setup-kubectl@v3
      with:
        version: ${{ inputs.kubectl-version }}
    - name: Set Kubeconfig
      uses: azure/k8s-set-context@v3
      with:
        method: kubeconfig
        kubeconfig: ${{ secrets.k8s-kubeconfig }}

    - name: Fetch Kubernetes Cluster details
      run: |
        kubectl version --short
        echo -------------------
        kubectl get nodes
      
    - name: Save Nginx Ingress Controller IP as a GitHub Environment Variable
      run: |
        echo "INGRESS_IP=$(kubectl -n ingress-nginx get services ingress-nginx-controller -o jsonpath="{.status.loadBalancer.ingress[0].ip}")" >> $GITHUB_ENV

    - name: Replace Tokens in Manifest files
      uses: cschleiden/replace-tokens@v1
      with:
        tokenPrefix: '_{_'
        tokenSuffix: '_}_'
        files: '["kubernetes/${{ inputs.k8s-manifest-dir }}/*.yaml"]'
      env:
        NAMESPACE: ${{ vars.NAMESPACE }}
        REPLICA: ${{ vars.REPLICAS }}
        IMAGE: ${{ vars.DOCKERHUB_USERNAME }}/solar-system:${{ github.sha }}
        INGRESS_IP: ${{ inputs.mongodb-uri }}

    - name: Check files
      run: |
        cat kubernetes/${{ inputs.k8s-manifest-dir }}/*.yaml

    - name: Create MongoDB Secret
      run: |
        kubectl -n ${{ vars.NAMESPACE }} create secret generic mongo-db-creds \
        --from-literal=MONGO_URI=${{ env.MONGO_URI }} \
        --from-literal=MONGO_USERNAME=${{ vars.MONGO_USERNAME }} \
        --from-literal=MONGO_PASSWORD=${{ secrets.mongodb-password }} \
        --save-config \
        --dry-run=client \
        -o yaml | kubectl apply -f ${{ inputs.k8s-manifest-dir }}

    - name: Deploy to Dev Env
      run: |
        kubectl apply -f kubernetes/development

    - name: Set Application Ingress Host URL
      id: set-ingress-host-address
      run: | 
        echo "APP_INGRESS_HOST=$(kubectl -n ${{ vars.NAMESPACE }} \
          get ingress -o jsonpath='{.items[0].spec.tls[0].hosts[0]}')" \
          >> "$GITHUB_OUTPUT"